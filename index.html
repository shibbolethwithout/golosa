    <script>
      // Определяем браузер и вешаем класс на <html>
      (function() {
        var ua = navigator.userAgent.toLowerCase();
        var el = document.documentElement;
        if (ua.includes('firefox')) el.classList.add('is-firefox');
        else if (ua.includes('chrome') && !ua.includes('edg')) el.classList.add('is-chrome');
        else if (ua.includes('safari')) el.classList.add('is-safari');
      })();
    </script>
